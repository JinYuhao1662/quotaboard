<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coding Plan 额度看板</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2312946f'/%3E%3Cpath d='M13 3 5 13.5h6l-1 7.5 8-10.5h-6l1-7.5z' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f6e5a"/><stop offset="1" stop-color="#34c98a"/></linearGradient>
</defs></svg>

<header class="topbar">
  <div class="wrap">
    <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg></span><span class="t">Coding Plan 额度看板</span></div>
    <div class="tools">
      <span class="lbl">用户</span><select id="ownerFilter" class="select" title="按用户标签筛选"><option value="">全部</option></select>
      <span class="lbl">服务商</span><select id="provFilter" class="select" title="按服务商筛选"><option value="">全部</option></select>
      <select id="sort" class="select" title="排序">
        <option value="provider">服务商 / 订阅起始</option>
        <option value="reset">重置 近 → 远</option>
        <option value="expiry">到期 近 → 远</option>
      </select>
      <div class="segmented" id="viewSwitch">
        <button data-view="cards" class="active"><svg class="i sm" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>卡片</button>
        <button data-view="table"><svg class="i sm" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>列表</button>
      </div>
      <button class="icon-btn lg" id="themeBtn" title="切换深色 / 浅色"></button>
      <form method="post" action="/logout" id="logoutForm" hidden style="display:contents"><button class="icon-btn lg" type="submit" title="退出登录"><svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button></form>
      <button class="btn primary" id="addBtn"><svg class="i" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>新增账号</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="overview" id="overview"></section>
  <section class="card tl-card" id="timeline"></section>
  <section>
    <div class="section-head">
      <h2>账号</h2><span class="count" id="countLabel"></span>
    </div>
    <div id="accounts"></div>
  </section>
</main>

<datalist id="providers"><option value="Claude"><option value="ChatGPT"><option value="Gemini"><option value="Copilot"><option value="Cursor"></datalist>
<datalist id="owners"></datalist>

<!-- 新增 / 编辑 -->
<dialog id="editor">
  <form id="editorForm" novalidate>
    <header><h3 id="editorTitle">新增账号</h3><button type="button" class="icon-btn" data-close="editor"><svg class="i" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></header>
    <div class="body">
      <div class="form-grid">
        <label class="field"><span>用户标签</span><input type="text" name="owner" list="owners" placeholder="全部（所有人共享），或某个人：我 / 家人 / 团队…"></label>
        <label class="field"><span>用户名 <em>*</em></span><input type="text" name="name" required placeholder="如：主号、备用-1"></label>
        <label class="field"><span>服务商 <em>*</em></span><input type="text" name="provider" list="providers" required placeholder="Claude / ChatGPT / …"></label>
        <label class="field"><span>账号 <em>*</em></span><input type="text" name="account" required placeholder="登录邮箱 / 账号"></label>
        <label class="field"><span>密码 <em>*</em></span>
          <div class="input-wrap"><input type="password" name="password" required placeholder="明文保存在本地"><button type="button" class="icon-btn" data-eye><svg class="i sm" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        </label>
        <div class="field"><span>重置时间 <em>*</em></span>
          <div class="row">
            <select class="input" name="resetDay">
              <option value="1">周一</option><option value="2">周二</option><option value="3">周三</option><option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="7">周日</option>
            </select>
            <input type="time" name="resetTime" required value="08:00">
          </div>
        </div>
        <label class="field"><span>订阅开始时间 <em>*</em></span><input type="datetime-local" name="subStart" required step="60"></label>
        <div class="field"><span>已用额度 <em>*</em></span>
          <div class="row">
            <input type="range" name="usedRange" min="0" max="100" step="1" value="0">
            <input type="number" name="used" min="0" max="100" step="1" required value="0"><span>%</span>
          </div>
        </div>
        <label class="field span2"><span>备注</span><textarea name="notes" rows="2" placeholder="可空：用途、续费提醒、注意事项…"></textarea></label>
      </div>
      <details class="optional" id="optional">
        <summary><svg class="i sm" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>可选信息 <span class="muted">邮件接码平台 · 辅助邮箱 · 手机号 · 短信接码平台 · 2FA</span></summary>
        <div class="form-grid">
          <label class="field"><span>邮件接码平台</span><input type="text" name="mailPlatform" placeholder="如：mail.tm、tempmail.plus"></label>
          <label class="field"><span>辅助邮箱</span><input type="text" name="recoveryEmail" placeholder="备用 / 恢复邮箱"></label>
          <label class="field"><span>手机号</span><input type="text" name="phone" placeholder="+86 …"></label>
          <label class="field"><span>短信接码平台</span><input type="text" name="smsPlatform" placeholder="如：sms-activate、5sim"></label>
          <label class="field"><span>2FA</span><input type="text" name="totp" placeholder="TOTP 密钥或备份码"></label>
        </div>
      </details>
    </div>
    <footer>
      <button type="button" class="btn ghost danger" id="editorDelete"><svg class="i sm" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>删除账号</button>
      <span class="spacer"></span>
      <button type="button" class="btn ghost" data-close="editor">取消</button>
      <button type="submit" class="btn primary">保存</button>
    </footer>
  </form>
</dialog>

<!-- 快速更新额度 -->
<dialog id="quick" class="small">
  <form id="quickForm" novalidate>
    <header><h3 id="quickTitle">更新已用额度</h3><button type="button" class="icon-btn" data-close="quick"><svg class="i" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></header>
    <div class="body">
      <div class="quick-value"><span id="quickValue">0</span>%<small>已用</small></div>
      <div class="row">
        <input type="range" name="usedRange" min="0" max="100" step="1" value="0">
        <input type="number" name="used" min="0" max="100" step="1" value="0"><span>%</span>
      </div>
    </div>
    <footer>
      <button type="button" class="btn ghost" id="quickZero"><svg class="i sm" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>已重置，设为 0%</button>
      <span class="spacer"></span>
      <button type="submit" class="btn primary">保存</button>
    </footer>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script src="/static/app.js"></script>
</body>
</html>
